name: Build Swift Playgrounds App
on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Swift Playgrounds Package
        run: |
          # Swift Playgrounds apps need to be built differently
          # They can't use standard swift build, so we just validate syntax
          echo "Validating Swift syntax..."
          
          # Check for basic syntax errors in Swift files
          ERROR_COUNT=0
          for file in *.swift; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              if ! xcrun swift-frontend -typecheck "$file" 2>/dev/null; then
                echo "❌ Syntax error in $file"
                ERROR_COUNT=$((ERROR_COUNT + 1))
              fi
            fi
          done
          
          if [ $ERROR_COUNT -gt 0 ]; then
            echo "Build failed with $ERROR_COUNT error(s)" > build.log
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add build.log
            git commit -m "Upload build error log"
            git push
            exit 1
          fi
          
          echo "✅ Swift syntax validation passed"
      
      - name: Trigger Pushcut
        if: success()
        run: |
          echo "Triggering iPad deployment..."
          curl -X POST https://api.pushcut.io/js5k0Bts71CE5r5HB6-PL/notifications/GetDoneUpdate
