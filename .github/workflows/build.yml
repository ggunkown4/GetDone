name: Build Swift Playgrounds App
on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Find iOS SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $SDK"
          TOOLCHAIN=$(xcrun --find swift-frontend)
          echo "Swift frontend: $TOOLCHAIN"
      
      - name: Build Swift Playgrounds Package
        run: |
          echo "Validating Swift syntax..."
          
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ARCH="arm64"
          
          echo "Checking files as a single module..."
          if ! OUTPUT=$(xcrun swift-frontend -typecheck -sdk "$SDK" -target "${ARCH}-apple-ios26.0" -parse-as-library *.swift 2>&1); then
            echo "❌ Syntax error"
            echo -e "Build failed\n\n$OUTPUT" > build.log
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git config pull.rebase true
            git stash || true
            git pull || true
            git stash pop || true
            git add build.log
            git commit -m "Upload build error log" || true
            git push || true
            exit 1
          fi
          
          echo "✅ Swift syntax validation passed"
      
      - name: Trigger Pushcut
        if: success()
        run: |
          echo "Triggering iPad deployment..."
          curl -X POST https://api.pushcut.io/js5k0Bts71CE5r5HB6-PL/notifications/GetDoneUpdate
