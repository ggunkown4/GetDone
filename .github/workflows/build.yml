name: Build Swift Playgrounds App
on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Find iOS SDK
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $SDK"
          TOOLCHAIN=$(xcrun --find swift-frontend)
          echo "Swift frontend: $TOOLCHAIN"
      
      - name: Build Swift Playgrounds Package
        run: |
          echo "Validating Swift syntax..."
          
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ARCH="arm64"
          
          ERROR_COUNT=0
          ERROR_OUTPUT=""
          for file in *.swift; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              if ! OUTPUT=$(xcrun swift-frontend -typecheck -sdk "$SDK" -target "${ARCH}-apple-ios26.0" -parse-as-library "$file" 2>&1); then
                echo "❌ Syntax error in $file"
                ERROR_OUTPUT="$ERROR_OUTPUT\n--- $file ---\n$OUTPUT\n"
                ERROR_COUNT=$((ERROR_COUNT + 1))
              fi
            fi
          done
          
          if [ $ERROR_COUNT -gt 0 ]; then
            echo -e "Build failed with $ERROR_COUNT error(s)\n$ERROR_OUTPUT" > build.log
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git config pull.rebase true
            git stash || true
            git pull || true
            git stash pop || true
            git add build.log
            git commit -m "Upload build error log" || true
            git push || true
            exit 1
          fi
          
          echo "✅ Swift syntax validation passed"
      
      - name: Trigger Pushcut
        if: success()
        run: |
          echo "Triggering iPad deployment..."
          curl -X POST https://api.pushcut.io/js5k0Bts71CE5r5HB6-PL/notifications/GetDoneUpdate
